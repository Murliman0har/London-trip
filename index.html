/* Layout: one narrow column, day-at-a-time program with a colour-block time rail on each event. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#16202E; --muted:#5B6678; --line:#DDE2EA; --accent:#C2410C; --soft:#E9EDF3;
  --c-parayan:#C2410C; --c-katha:#A21C5B; --c-patotsav:#92600A; --c-pothiyatra:#7E22CE; --c-padramani:#0E7490;
  --c-vastu:#2F7D32; --c-sabha:#1D4ED8; --c-flight:#475569; --c-car:#6D4C41; --c-other:#52525B;
  --s-g:#9F1239; --s-hs:#3730A3; --s-mm:#0F766E; --s-hp:#4D7C0F; --s-np:#B45309; --s-ap:#BE185D;
  --now:#0B7A43;
  --display:"Bricolage Grotesque","Noto Sans Gujarati","Trebuchet MS",system-ui,sans-serif; --body:"Figtree","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1} h2{font-size:20px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:4px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.tab{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .date{flex:1;min-width:150px;text-align:center;font-family:var(--display);font-size:19px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:#C62828;border-color:#C62828}
.btn[disabled]{opacity:.55;cursor:default}
.place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.place .where{font-family:var(--display);font-size:24px;line-height:1.1;font-weight:700}
.place .meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 5px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em;flex:none}
.av.g{background:var(--s-g)}.av.hs{background:var(--s-hs)}.av.mm{background:var(--s-mm)}.av.hp{background:var(--s-hp)}.av.np{background:var(--s-np)}.av.ap{background:var(--s-ap)}
.av.all{background:var(--fg);color:var(--bg)}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ev.now{border-color:var(--now);box-shadow:0 0 0 2px var(--now)}
.rail{background:var(--c);color:#fff;padding:12px 10px;display:flex;flex-direction:column;gap:2px;justify-content:center;text-align:center;font-variant-numeric:tabular-nums}
.rail b{font-size:16px;font-family:var(--display)} .rail span{font-size:12px;opacity:.92}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{--cc:var(--c);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:color-mix(in srgb,var(--cc) 72%,var(--fg));background:color-mix(in srgb,var(--cc) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 40%,transparent)}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.now{background:var(--now);color:#fff} .pill.next{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.title{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.2}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.faint{color:var(--muted);font-size:13px}
.t-parayan{--c:var(--c-parayan)}.t-katha{--c:var(--c-katha)}.t-patotsav{--c:var(--c-patotsav)}.t-pothiyatra{--c:var(--c-pothiyatra)}.t-padramani{--c:var(--c-padramani)}.t-vastu{--c:var(--c-vastu)}.t-sabha{--c:var(--c-sabha)}.t-flight{--c:var(--c-flight)}.t-car{--c:var(--c-car)}.t-other{--c:var(--c-other)}.t-pravachan{--c:var(--c-pravachan)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.stay{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;width:100%}
.stay.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stay .n{font-family:var(--display);font-weight:600;font-size:17px}
.stay .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stay .days{font-family:var(--display);font-weight:700;font-size:18px;text-align:right}
.stay .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.srow{display:flex;gap:10px;align-items:center}.srow .av{width:34px;height:34px;font-size:12px}
.key{display:flex;flex-wrap:wrap;gap:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px))}
.form{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;margin:auto}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f label,.f .lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;background:var(--bg)}
.checks input{width:auto}
.note{font-size:13px;color:var(--muted)}
@media (max-width:420px){.ev{grid-template-columns:76px minmax(0,1fr)}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.ev{transition:box-shadow .2s}}

.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pics.one{grid-template-columns:1fr}
.pics img{width:100%;height:120px;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--soft);display:block}
.pics.one img{height:auto;max-height:420px;object-fit:contain}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative;width:84px;height:84px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.th .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;line-height:1}

  --c-padramani:#167b83; --c-vastu:#3b7c43; --c-sabha:#315da8; --c-flight:#586579;
  --c-car:#85533a; --c-other:#6d5b4c; --c-pravachan:#66771c;
}
body{

   var(--bg);
}
.wrap{padding-top:14px}
.head{
