}

/* Swaminarayan devotional theme */
:root{ color-scheme:only light;
  --bg:#fff8eb; --surface:#fffdf8; --fg:#3f2414; --muted:#80664f; --line:#ead7b5;
  --accent:#b85b16; --soft:#f7e8ca; --now:#247447;
  --c-parayan:#C62828; --c-katha:#9b3568; --c-patotsav:#9a6a12; --c-pothiyatra:#E8780E;
  --c-padramani:#C99A66; --c-vastu:#1FD26B; --c-sabha:#5FA82A; --c-flight:#2BA3DF;
  --c-car:#E8589A; --c-other:#6d5b4c; --c-pravachan:#E57373;
}
body{
 background:
   radial-gradient(ellipse at top, rgba(255,221,151,.28), transparent 42%),
   var(--bg);
}
.wrap{padding-top:14px}
.head{
 position:relative; overflow:hidden; padding:18px; border-radius:20px;
 border:1px solid #e8c78a;
 background:linear-gradient(135deg,#fff9e9 0%,#ffedc7 55%,#fffaf0 100%);
 box-shadow:0 7px 24px rgba(112,65,16,.10);
}
.head h1{color:#7b3511; letter-spacing:-.035em}
.head .sub{color:#855e36}
.hero{
 display:grid; grid-template-columns:94px minmax(0,1fr); gap:14px; align-items:center;
 margin-top:14px; padding:12px; border:1px solid #e6c47f; border-radius:16px;
 background:rgba(255,255,255,.72); position:relative; z-index:1;
}
.hero img{
 width:94px;height:116px;object-fit:cover;object-position:center 20%;
 border-radius:12px;border:2px solid #d7a64f;box-shadow:0 3px 12px rgba(88,48,8,.18);
 background:#f8e7bf;
}
.hero .mantra{font-family:var(--display);font-size:19px;font-weight:700;color:#8b3c12;line-height:1.2}
.hero .blessing{font-size:13px;color:#765538;margin-top:5px}
.hero .wx{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.hero .wx .now{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.tg{--c:#9b3568}.tg.i{--c:#167b83}.tg.b{--c:#6b5b2a}
